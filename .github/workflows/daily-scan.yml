name: Daily Scanner

# Runs all four discovery scanners (trusted feeds, site-crawl, repos,
# failures) once per day. The scanners share a global rate-limit budget via
# `scripts/scan_budget.py`: at most DAILY_SCAN_CAP issues are filed across
# all three scanners on any given UTC day. Anything beyond the cap is
# pushed to `registry/scan-queue.json` and drained on subsequent runs.
#
# Replaces the older weekly cadence (repo-scanner.yml, failure-scanner.yml).
# A separate bead handles retiring those workflows once this one is proven.

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC
  workflow_dispatch:        # Manual trigger for testing / one-off runs / queue flush
    inputs:
      daily_scan_cap:
        description: "Override DAILY_SCAN_CAP for this run only (default 20; use 80 to flush scan-queue)"
        required: false
        default: "20"
        type: string

permissions:
  issues: write             # `gh issue create` calls from the scanners
  contents: write           # commit registry/state updates back to main

concurrency:
  # Don't let two daily runs race on registry/scan-state.json (the rate
  # limiter's source of truth) — serialize them.
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Schedule path uses 35 after queue-flush + Miner BATCH_SIZE=4 (issue #180).
      # workflow_dispatch may override via inputs.daily_scan_cap (e.g. 80 for a one-shot drain).
      DAILY_SCAN_CAP: ${{ github.event.inputs.daily_scan_cap || '35' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PROJECT_PAT (admin) so the scanner-state commit can push directly to
          # main once branch protection requires the assayer check — the
          # github-actions bot would otherwise be blocked. The committed files
          # are registry state + DASHBOARD.md only (no source-notes/), so this
          # push does not trigger registry-rebuild.
          token: ${{ secrets.PROJECT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Show daily-scan cap
        run: echo "DAILY_SCAN_CAP=${DAILY_SCAN_CAP} (dispatch override or scheduled default)"

      # Scanner order: repo scanner first while we re-energize it (code search
      # is dormant until queries return hits + it needs daily-cap budget).
      # Then trusted feeds (curated), then failures, then site-crawl.
      # Whoever runs first gets first claim on the daily cap; overflow goes
      # to registry/scan-queue.json.

      # All scanners use PROJECT_PAT for GH_TOKEN so that `gh issue create`
      # fires the issues:opened event, which triggers the source pipeline.
      # GITHUB_TOKEN can't do this (by design — prevents recursive triggers).

      - name: Run repo scanner
        env:
          # Prefer PROJECT_PAT for /search/code — GITHUB_TOKEN often hits
          # secondary 429s during dense Actions traffic.
          GITHUB_TOKEN: ${{ secrets.PROJECT_PAT }}
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/scan-repos.py

      - name: Run trusted-feed scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/scan-trusted.py

      - name: Run failure scanner (Hacker News)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/scan-failures.py --source hn

      - name: Run site-crawl scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          SITE_CRAWL_MODEL: deepseek-v4-flash
        run: python scripts/scan-sites.py

      - name: Run failure scanner (GitHub Discussions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/scan-failures.py --source github

      # Regenerate the content-derived dashboard. Reads source-notes/
      # frontmatter, guide/*.md, and the local git history to compute
      # per-chapter source counts, oldest sources, staleness, and weekly
      # line-count deltas. Cheap and pure — runs after the scanners so it
      # picks up any newly merged sources from the same UTC day. Bead hi-4yk.18.
      - name: Regenerate DASHBOARD.md
        run: python scripts/generate_dashboard.py

      - name: Commit registry + rate-limit state + dashboard updates
        run: |
          git config user.name "hitchhiker-bot"
          git config user.email "bot@hitchhiker-guide.dev"
          # Stage every file the scanners or dashboard generator may have
          # touched. `git add` is tolerant of files that don't exist yet
          # (first run before any state has been written), so we don't have
          # to special-case it.
          git add registry/repos.json \
                  registry/trusted-feeds-state.json \
                  registry/site-crawl-state.json \
                  registry/scan-state.json \
                  registry/scan-queue.json \
                  DASHBOARD.md || true
          if git diff --staged --quiet; then
            echo "No registry/state/dashboard changes to commit."
          else
            git commit -m "chore: daily scanner registry + rate-limit state + dashboard"
            # Rebase onto any commits pushed while this job was running
            # (e.g. human pushes to the same branch during workflow_dispatch).
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
