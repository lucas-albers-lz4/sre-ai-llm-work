name: Check derived registries

# Guard against hand-edits / stale derived indexes (#506).
# sources.json + claims-index.json must match a fresh rebuild from source-notes/.

on:
  pull_request:
    paths:
      - 'source-notes/**'
      - 'scripts/build_registry.py'
      - 'scripts/build_claims_index.py'
      - 'registry/sources.json'
      - 'registry/claims-index.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Check sources.json
        run: python3 scripts/build_registry.py --check

      - name: Check claims-index.json
        run: python3 scripts/build_claims_index.py --check
