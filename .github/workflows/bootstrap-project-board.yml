name: Bootstrap Project Board

# One-shot: create (or reuse) the GitHub Project v2 board and print the
# GraphQL IDs needed by update-project-field.sh / pipeline workflows.
# Uses PROJECT_PAT (classic, repo+project). Safe to re-run (idempotent).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap project + dump field IDs
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: lucas-albers-lz4
          PROJECT_TITLE: SRE AI LLM Work Pipeline
          REPO: lucas-albers-lz4/sre-ai-llm-work
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROJECT_PAT secret is not set"
            exit 1
          fi

          # Prefer @me so PROJECT_PAT's owning user is used (avoids
          # "unknown owner type" when --owner <login> fails under some PATs).
          OWNER_FLAG="@me"

          who=$(gh api user --jq '.login')
          echo "Authenticated as: $who (expected: $PROJECT_OWNER)"

          existing=$(gh project list --owner "$OWNER_FLAG" --format json \
            | jq -r --arg t "$PROJECT_TITLE" \
              '.projects[] | select(.title == $t) | .number' | head -1)

          if [ -n "$existing" ]; then
            PROJECT_NUMBER="$existing"
            echo "Reusing project #${PROJECT_NUMBER}"
          else
            PROJECT_NUMBER=$(gh project create \
              --owner "$OWNER_FLAG" \
              --title "$PROJECT_TITLE" \
              --format json | jq -r '.number')
            echo "Created project #${PROJECT_NUMBER}"
          fi

          PROJECT_NODE_ID=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER_FLAG" --format json \
            | jq -r '.id')
          echo "PROJECT_ID=$PROJECT_NODE_ID"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER"

          gh project link "$PROJECT_NUMBER" --owner "$OWNER_FLAG" --repo "$REPO" || true

          # Create fields (ignore "already exists")
          gh project field-create "$PROJECT_NUMBER" --owner "$OWNER_FLAG" \
            --name "Triage Status" \
            --data-type SINGLE_SELECT \
            --single-select-options "untriaged,accepted,rejected,duplicate,in-progress,done" \
            || true
          gh project field-create "$PROJECT_NUMBER" --owner "$OWNER_FLAG" \
            --name "Assayer Check" \
            --data-type SINGLE_SELECT \
            --single-select-options "pending,running,passed,failed,skipped" \
            || true
          gh project field-create "$PROJECT_NUMBER" --owner "$OWNER_FLAG" \
            --name "Chapter" \
            --data-type SINGLE_SELECT \
            --single-select-options "ch00-principles,ch01-incident-response,ch02-observability,ch03-runbooks-and-agents,ch04-oncall-and-toil,ch05-llm-ops-reliability,ch06-security-and-trust,cross-cutting" \
            || true

          FIELDS_JSON=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER_FLAG" --format json)
          echo ""
          echo "===== FIELD + OPTION IDS (paste into workflows) ====="
          echo "$FIELDS_JSON" | jq -r '
              .fields[]
              | select(.name == "Triage Status" or .name == "Assayer Check" or .name == "Chapter")
              | "\nFIELD \(.name)\n  id=\(.id)"
                + (if .options then (.options[] | "\n  option \(.name)=\(.id)") else "" end)
            '

          {
            echo "## Project board bootstrap"
            echo ""
            echo "- **Auth user:** \`$who\`"
            echo "- **URL:** https://github.com/users/${who}/projects/${PROJECT_NUMBER}"
            echo "- **PROJECT_ID:** \`${PROJECT_NODE_ID}\`"
            echo ""
            echo '```'
            echo "$FIELDS_JSON" | jq -r '
                .fields[]
                | select(.name == "Triage Status" or .name == "Assayer Check" or .name == "Chapter")
                | "FIELD \(.name) id=\(.id)"
                  + (if .options then (.options[] | "\n  \(.name)=\(.id)") else "" end)
              '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
