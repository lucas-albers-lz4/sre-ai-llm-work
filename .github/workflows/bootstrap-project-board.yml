name: Bootstrap Project Board

# One-shot: create (or reuse) the GitHub Project v2 board and print the
# GraphQL IDs needed by update-project-field.sh / pipeline workflows.
# Uses PROJECT_PAT (classic, repo+project). Safe to re-run (idempotent).
# Uses GraphQL directly — avoids `gh project` CLI scope quirks (read:org).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap project + dump field IDs
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_TITLE: SRE AI LLM Work Pipeline
          REPO_OWNER: lucas-albers-lz4
          REPO_NAME: sre-ai-llm-work
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROJECT_PAT secret is not set"
            exit 1
          fi

          VIEWER=$(gh api graphql -f query='query { viewer { id login } }')
          OWNER_ID=$(echo "$VIEWER" | jq -r '.data.viewer.id')
          WHO=$(echo "$VIEWER" | jq -r '.data.viewer.login')
          echo "Authenticated as: $WHO ($OWNER_ID)"

          # Find existing project by title (paginate first page is enough for MVP)
          EXISTING=$(gh api graphql -f query='
            query($login:String!) {
              user(login:$login) {
                projectsV2(first:50) {
                  nodes { id number title url }
                }
              }
            }' -f login="$WHO")

          PROJECT_NODE_ID=$(echo "$EXISTING" | jq -r --arg t "$PROJECT_TITLE" \
            '.data.user.projectsV2.nodes[] | select(.title==$t) | .id' | head -1)
          PROJECT_NUMBER=$(echo "$EXISTING" | jq -r --arg t "$PROJECT_TITLE" \
            '.data.user.projectsV2.nodes[] | select(.title==$t) | .number' | head -1)

          if [ -z "$PROJECT_NODE_ID" ] || [ "$PROJECT_NODE_ID" = "null" ]; then
            CREATED=$(gh api graphql -f query='
              mutation($owner:ID!,$title:String!) {
                createProjectV2(input:{ownerId:$owner,title:$title}) {
                  projectV2 { id number url title }
                }
              }' -f owner="$OWNER_ID" -f title="$PROJECT_TITLE")
            PROJECT_NODE_ID=$(echo "$CREATED" | jq -r '.data.createProjectV2.projectV2.id')
            PROJECT_NUMBER=$(echo "$CREATED" | jq -r '.data.createProjectV2.projectV2.number')
            echo "Created project #$PROJECT_NUMBER ($PROJECT_NODE_ID)"
          else
            echo "Reusing project #$PROJECT_NUMBER ($PROJECT_NODE_ID)"
          fi

          # Link repo (ignore if already linked)
          REPO_ID=$(gh api graphql -f query='
            query($o:String!,$n:String!) {
              repository(owner:$o,name:$n){ id }
            }' -f o="$REPO_OWNER" -f n="$REPO_NAME" --jq '.data.repository.id')
          gh api graphql -f query='
            mutation($p:ID!,$r:ID!) {
              linkProjectV2ToRepository(input:{projectId:$p,repositoryId:$r}) {
                repository { nameWithOwner }
              }
            }' -f p="$PROJECT_NODE_ID" -f r="$REPO_ID" >/dev/null 2>&1 || true

          ensure_select_field() {
            local name="$1"
            shift
            local have
            have=$(gh api graphql -f query='
              query($id:ID!) {
                node(id:$id) {
                  ... on ProjectV2 {
                    fields(first:50) {
                      nodes {
                        ... on ProjectV2SingleSelectField { name id }
                      }
                    }
                  }
                }
              }' -f id="$PROJECT_NODE_ID" \
              | jq -r --arg n "$name" '.data.node.fields.nodes[] | select(.name==$n) | .id' | head -1)
            if [ -n "$have" ]; then
              echo "Field already exists: $name ($have)"
              return 0
            fi

            # Build options fragment: {name: "...", color: GRAY, description: ""}
            local opts=""
            local opt
            for opt in "$@"; do
              [ -n "$opts" ] && opts+=", "
              opts+="{name: \"$opt\", color: GRAY, description: \"\"}"
            done

            gh api graphql -f query="
              mutation {
                createProjectV2Field(input:{
                  projectId: \"$PROJECT_NODE_ID\",
                  dataType: SINGLE_SELECT,
                  name: \"$name\",
                  singleSelectOptions: [$opts]
                }) {
                  projectV2Field {
                    ... on ProjectV2SingleSelectField { id name }
                  }
                }
              }" >/dev/null
            echo "Created field: $name"
          }

          ensure_select_field "Triage Status" \
            untriaged accepted rejected duplicate in-progress done
          ensure_select_field "Assayer Check" \
            pending running passed failed skipped
          ensure_select_field "Chapter" \
            ch00-principles ch01-incident-response ch02-observability \
            ch03-runbooks-and-agents ch04-oncall-and-toil \
            ch05-llm-ops-reliability ch06-security-and-trust cross-cutting

          FIELDS=$(gh api graphql -f query='
            query($id:ID!) {
              node(id:$id) {
                ... on ProjectV2 {
                  fields(first:50) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        name
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -f id="$PROJECT_NODE_ID")

          echo ""
          echo "PROJECT_ID=$PROJECT_NODE_ID"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER"
          echo "URL=https://github.com/users/${WHO}/projects/${PROJECT_NUMBER}"
          echo ""
          echo "===== FIELD + OPTION IDS ====="
          echo "$FIELDS" | jq -r '
            .data.node.fields.nodes[]
            | select(.name == "Triage Status" or .name == "Assayer Check" or .name == "Chapter")
            | "\nFIELD \(.name)\n  id=\(.id)"
              + (.options[] | "\n  option \(.name)=\(.id)")
          '

          {
            echo "## Project board bootstrap"
            echo ""
            echo "- **Auth user:** \`$WHO\`"
            echo "- **URL:** https://github.com/users/${WHO}/projects/${PROJECT_NUMBER}"
            echo "- **PROJECT_ID:** \`${PROJECT_NODE_ID}\`"
            echo ""
            echo '```'
            echo "$FIELDS" | jq -r '
              .data.node.fields.nodes[]
              | select(.name == "Triage Status" or .name == "Assayer Check" or .name == "Chapter")
              | "FIELD \(.name) id=\(.id)"
                + (.options[] | "\n  \(.name)=\(.id)")
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bulk-add open issues/PRs and smoke-test field update
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_ID: PVT_kwHOCzGzi84BdODF
          REPO: lucas-albers-lz4/sre-ai-llm-work
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          add_item() {
            local type="$1" number="$2"
            local node_id
            if [ "$type" = "pr" ]; then
              node_id=$(gh api graphql -f query='
                query($o:String!,$r:String!,$n:Int!){
                  repository(owner:$o,name:$r){pullRequest(number:$n){id}}
                }' -f o="$OWNER" -f r="$NAME" -F n="$number" \
                --jq '.data.repository.pullRequest.id')
            else
              node_id=$(gh api graphql -f query='
                query($o:String!,$r:String!,$n:Int!){
                  repository(owner:$o,name:$r){issue(number:$n){id}}
                }' -f o="$OWNER" -f r="$NAME" -F n="$number" \
                --jq '.data.repository.issue.id')
            fi
            gh api graphql -f query='
              mutation($p:ID!,$c:ID!){
                addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}
              }' -f p="$PROJECT_ID" -f c="$node_id" >/dev/null
            echo "Added $type #$number"
          }

          for n in $(gh issue list --repo "$REPO" --state all --json number --limit 100 --jq '.[].number'); do
            add_item issue "$n" || echo "skip issue #$n"
          done
          for n in $(gh pr list --repo "$REPO" --state all --json number --limit 100 --jq '.[].number'); do
            add_item pr "$n" || echo "skip pr #$n"
          done

          # Smoke-test: set Assayer Check=passed on a recent merged source PR if present
          SAMPLE_PR=$(gh pr list --repo "$REPO" --state all --label source-note --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$SAMPLE_PR" ]; then
            .github/scripts/update-project-field.sh \
              "$SAMPLE_PR" \
              "PVTSSF_lAHOCzGzi84BdODFzhXxGe4" \
              "9d2034a5" \
              pr
          fi
