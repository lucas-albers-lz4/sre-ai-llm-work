               Do NOT skip this — Cross-References is a hard requirement
               in the Assayer review standards.

            ## 2. Extract

            Fetch the source URL from the issue body (or Prospector
            comment) and read it deeply per `agents/MINER.md` §1-5. For
            issues labeled `triaged:failure`, additionally follow the
            "Failure Reports" section at the bottom of MINER.md.

            If extraction surfaces a contradiction with an existing
            source note, follow MINER.md §4a and file a contradiction
            issue using `.github/ISSUE_TEMPLATE/contradiction.yml` BEFORE
            opening your source-note PR. Reference that contradiction
            issue under `**Contradicts:**` in the source note.

            ## 3. Write the source note

            Use `source-notes/.template-general.md`. Filename slug
            should match existing conventions in `source-notes/`:
              - blog post     → `blog-<author-or-publisher>-<topic>.md`
              - paper         → `paper-<author>-<topic>.md`
              - failure report→ `failure-<tool-or-symptom>-<detail>.md`
              - docs/discussion → `<type>-<source>-<topic>.md`
            Read a couple of existing notes and match their style.

            Frontmatter MUST set:
              - `source_url:` to the actual source URL
              - `issue:` to "#${{ matrix.issue }}"
              - `date_extracted:` and `last_checked:` to today (UTC)
              - `confidence_overall:` based on the body of evidence,
                NOT left as the template placeholder

            Do NOT edit `registry/sources.json`. The registry is a DERIVED
            index, rebuilt automatically from source-note front-matter by
            `scripts/build_registry.py` after merge (see registry-rebuild.yml).
            Having every miner append to that one shared file is what made all
            parallel miner PRs conflict on it. Just make sure THIS note's
            front-matter is complete and correct — the index is generated from it.

            ## 4. Open the PR

            Branch name: `miner/issue-${{ matrix.issue }}-r${{ github.run_id }}`

              git checkout -b miner/issue-${{ matrix.issue }}-r${{ github.run_id }}
              git add source-notes/
              git commit -m "source: <slug> (#${{ matrix.issue }})"
              git push -u origin miner/issue-${{ matrix.issue }}-r${{ github.run_id }}

            Then open the PR. Write the body to a file first to avoid
            shell quoting issues:

              cat > /tmp/miner-pr-body.md <<'PR_BODY_EOF'
              Source note extracted by the Miner agent for #${{ matrix.issue }}.

              Miner backend: zen (`${{ needs.preflight.outputs.model }}` trial).

              See `agents/MINER.md` for the extraction rubric and the
              Assayer review standards this PR will be checked against.
              The source issue stays open until merge so the Assayer
              verdict and any rework are tracked there.
              PR_BODY_EOF

              gh pr create \
                --repo ${{ github.repository }} \
                --base main \
                --head miner/issue-${{ matrix.issue }}-r${{ github.run_id }} \
                --title "source: <slug> (#${{ matrix.issue }})" \
                --body-file /tmp/miner-pr-body.md \
                --label source-note

            The `source-note` label is what triggers the Assayer
            workflow (`.github/workflows/assayer.yml`) — the PR must
            carry it.

            ## 5. Update the source issue

            Comment on the source issue with the PR link, apply
            `mining-complete`, and remove `mining-queued`:

              gh issue comment ${{ matrix.issue }} \
                --repo ${{ github.repository }} \
                --body "Miner PR opened (zen): <PR-URL>"
              gh issue edit ${{ matrix.issue }} \
                --repo ${{ github.repository }} \
                --add-label "mining-complete" \
                --remove-label "mining-queued"

            ## Constraints

            - Do NOT edit anything under `guide/` — only the Smith
              touches the guide.
            - Do NOT merge your own PR. The Assayer reviews; humans
              merge.
            - If the source is paywalled, dead, or otherwise unreadable,
              comment on the issue explaining why, then label AND close it
              (the label is the permanent record; closing keeps the open-issue
              count meaningful — reopen to retry if the source becomes readable):
                gh issue edit ${{ matrix.issue }} \
                  --repo ${{ github.repository }} \
                  --add-label "miner-blocked" \
                  --remove-label "mining-queued"
                gh issue close ${{ matrix.issue }} \
                  --repo ${{ github.repository }} \
                  --comment "Auto-closed: source unreadable (miner-blocked). Reopen if it becomes accessible."
              Exit WITHOUT opening a PR.
          claude_args: |
            --model ${{ needs.preflight.outputs.model }}
            --max-turns 60
            --allowedTools "Bash(*)" "Read" "Write" "Edit" "Glob" "Grep" "WebFetch"

      - name: Dispatch Assayer (bypass pull_request rate limit)
        # The Miner just created a PR via gh pr create. The resulting
        # pull_request:opened event normally triggers assayer.yml, but
        # GitHub silently rate-limits pull_request webhook delivery for
        # the same user/PAT — ~35% of events were getting dropped in
        # steady state, especially the 2nd+ PR in a batch (47% stuck
        # rate observed). Explicitly dispatch Assayer via the workflow
        # API instead, which is not subject to webhook rate-limiting.
        # The pull_request trigger is still kept as a belt-and-suspenders
        # path; assayer.yml concurrency-cancels duplicates.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          BRANCH: miner/issue-${{ matrix.issue }}-r${{ github.run_id }}
        run: |
          # Find the PR the Miner just opened. If it didn't open one
          # (e.g. miner-blocked), exit cleanly.
          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No PR found for branch $BRANCH — Miner may have exited via miner-blocked."
            exit 0
          fi
          echo "Dispatching Assayer for PR #$PR_NUM (branch $BRANCH)"
          gh workflow run assayer.yml \
            --repo "${{ github.repository }}" \
            --field pr_number="$PR_NUM"

      - name: Record mine attempt or exhaust budget
        # Caps unbounded hourly re-mines of a permanently bad issue (issue #272).
        # Runs even when the Miner step fails; continue-on-error so a label API
        # hiccup does not fail the matrix job.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ matrix.issue }}
          MAX_MINE_ATTEMPTS: '3'
          BRANCH: miner/issue-${{ matrix.issue }}-r${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Only one of the Miner steps runs; the others are skipped.
          MINER_OUTCOME: ${{ steps.miner.outcome != 'skipped' && steps.miner.outcome || (steps.miner_openrouter.outcome != 'skipped' && steps.miner_openrouter.outcome || steps.miner_zen.outcome) }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          LABELS_JSON=""
          for attempt in 1 2 3; do
            if LABELS_JSON=$(gh issue view "$ISSUE" --repo "$REPO" --json labels -q '[.labels[].name]' 2>/dev/null); then
              break
            fi
            echo "warn: gh issue view failed (try $attempt/3); retrying..."
            sleep $((attempt * 2))
            LABELS_JSON=""
          done
          if [ -z "$LABELS_JSON" ]; then
            echo "warn: could not read labels for #$ISSUE after retries; skipping attempt accounting."
            exit 0
          fi
          echo "issue=#$ISSUE miner_outcome=$MINER_OUTCOME labels=$LABELS_JSON"

          if echo "$LABELS_JSON" | jq -e 'index("mining-complete") or index("miner-blocked") or index("extraction-rejected")' >/dev/null; then
            echo "Terminal state already — no attempt accounting."
            if echo "$LABELS_JSON" | jq -e 'index("mining-complete")' >/dev/null; then
              ATTEMPT_LABELS=$(echo "$LABELS_JSON" | jq -r '.[] | select(test("^mine-attempt-[0-9]+$"))')
              if [ -n "$ATTEMPT_LABELS" ]; then
                for L in $ATTEMPT_LABELS; do
                  gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$L" || true
                done
                echo "Stripped mine-attempt-* after mining-complete."
              fi
            fi
            exit 0
          fi

          # False-positive gate: PR opened for this run but agent forgot a
          # terminal label — do not burn an attempt slot.
          PR_NUM=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$PR_NUM" ]; then
            echo "Open PR #$PR_NUM on $BRANCH without terminal label — skipping attempt increment."
            gh issue comment "$ISSUE" --repo "$REPO" \
              --body "Miner opened PR #${PR_NUM} but did not apply \`mining-complete\` / \`miner-blocked\`. Attempt budget not incremented for this run. See ${RUN_URL}" \
              || true
            exit 0
          fi

          ATTEMPTS=$(echo "$LABELS_JSON" | jq '[.[] | select(test("^mine-attempt-[0-9]+$"))] | length')
          NEXT=$((ATTEMPTS + 1))
          echo "Non-terminal outcome — recording mine-attempt-$NEXT (prior=$ATTEMPTS, max=$MAX_MINE_ATTEMPTS)"

          gh issue edit "$ISSUE" --repo "$REPO" --add-label "mine-attempt-$NEXT" || true

          if [ "$NEXT" -ge "$MAX_MINE_ATTEMPTS" ]; then
            echo "Attempt budget exhausted — applying miner-blocked and closing."
            gh issue edit "$ISSUE" --repo "$REPO" \
              --add-label "miner-blocked" \
              --remove-label "mining-queued" || true
            gh issue close "$ISSUE" --repo "$REPO" --reason "not planned" \
              --comment "Auto-blocked: Miner failed ${MAX_MINE_ATTEMPTS} times without mining-complete / miner-blocked. Run: ${RUN_URL}. To retry: remove miner-blocked and all mine-attempt-*, reopen, and re-add mining-queued." \
              || true
          fi

      - name: Update project board (assayer pending)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          LABELS=$(GH_TOKEN="$GH_READ_TOKEN" gh issue view "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          if ! echo "$LABELS" | grep -q "^mining-complete$"; then
            echo "mining-complete label not found; skipping project update."
            exit 0
          fi

          .github/scripts/update-project-field.sh \
            "$ISSUE_NUMBER" \
            "PVTSSF_lAHOCzGzi84BdODFzhXxGe4" \
            "c376555e"
