name: DeepSeek Agent Smoke Test

# Verifies anthropics/claude-code-action runs successfully when routed to
# DeepSeek's Anthropic-compatible API via DEEPSEEK_API_KEY +
# .github/actions/configure-deepseek. Foundation check for every agent workflow.
#
# Trigger manually from the Actions tab after secret rotation or action upgrades.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # required by anthropics/claude-code-action OIDC auth

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure DeepSeek for Claude Code
        uses: ./.github/actions/configure-deepseek
        with:
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}


      - name: Run Claude Code with a trivial prompt
        uses: anthropics/claude-code-action@v1
        with:
          # Bypass Claude GitHub App OIDC — repo has no App install; API key auth only.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          prompt: |
            Print exactly one line: "hitchhiker smoke test ok".
            Do not edit any files. Do not run any tools beyond what
            is needed to print that line. Then exit.
          claude_args: |
            --model deepseek-v4-flash
            --max-turns 2
            --allowedTools "Bash(*)"
